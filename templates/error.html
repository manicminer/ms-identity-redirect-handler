<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login Error</title>
  <style>
    body {
      font-family: sans-serif;
      font-size: 11pt;
    }
    #error {
      background-color: #666;
      color: white;
      cursor: pointer;
      padding: 18px;
      width: 100%;
      border: none;
      text-align: left;
      outline: none;
      font-size: 15px;
    }
    #error.active, #error:hover {
      background-color: #444;
    }
    #error:after {
      content: '+'; /* Unicode character for "plus" sign (+) */
      font-size: 16px;
      font-weight: bold;
      color: white;
      float: right;
      margin-left: 5px;
    }
    #error.active:after {
      content: "-"; /* Unicode character for "minus" sign (-) */
    }
    #errorDetails {
      overflow: hidden;
      background-color: #f1f1f1;
      max-height: 0;
      transition: max-height 0.2s ease-out;
    }
    #errorDetails > p {
      padding: 20px;
    }
  </style>
  <script type="text/javascript">
    window.onload = function() {
      document.getElementById("error").addEventListener("click", function() {
        this.classList.toggle("active");
        var content = document.getElementById("errorDetails");
        if (content.style.maxHeight) {
          content.style.maxHeight = null;
        } else {
          content.style.maxHeight = content.scrollHeight + "px";
        }
      });
    };
  </script>
</head>
<body>
  <h2>Login Error</h2>
  <p>Unfortunately, there was a problem signing in to the application.</p>
  <p>Please go back and try again, or contact the support team for assistance if this issue persists.</p>
  <p>The following error information may be useful in diagnosing the problem.</p>
  <div><button id="error">Show Error Details</button></div>
  <div id="errorDetails">
    <p style="font-weight: bold;">%[1]s</p>
    <p>%[2]s</p>
  </div>
</body>
</html>
